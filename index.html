<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGIT AI Mentor</title>
  <link rel="icon" href="logo.jpg" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <section id="languageScreen" class="language-screen">
      <div class="lang-inner">
        <div class="logo-wrapper">
          <img src="download.jpg" alt="NGIT Logo" class="logo animate-pulse-slow" />
        </div>
        <h1 class="title">NGIT AI Mentor</h1>
        <p class="subtitle">Create an account or sign in to access the NGIT AI Mentor.</p>

        <div class="auth-tabs">
          <button id="showLoginBtn" class="auth-tab active" type="button">Login</button>
          <button id="showRegisterBtn" class="auth-tab" type="button">Register</button>
        </div>

        <form id="loginForm" class="name-form" onsubmit="event.preventDefault();">
          <div class="input-group">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" placeholder="you@example.com" required />
          </div>
          <div class="input-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="********" required />
          </div>
          <div class="start-action">
            <button id="loginBtn" class="start-btn" type="submit">
              <span>Login</span>
              <span class="material-symbols-outlined">arrow_forward</span>
            </button>
          </div>
        </form>

        <form id="registerForm" class="name-form hidden" onsubmit="event.preventDefault();">
          <div class="input-group">
            <label for="registerName">Full Name</label>
            <input id="registerName" type="text" placeholder="e.g. Tahir Sani" maxlength="80" required />
          </div>
          <div class="input-group">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" type="email" placeholder="you@example.com" required />
          </div>
          <div class="input-group">
            <label for="registerPassword">Password</label>
            <input id="registerPassword" type="password" placeholder="********" required />
          </div>
          <div class="input-group">
            <label for="registerGender">Gender</label>
            <select id="registerGender" required>
              <option value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="start-action">
            <button id="registerBtn" class="start-btn" type="submit">
              <span>Register</span>
              <span class="material-symbols-outlined">arrow_forward</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <section id="chatScreen" class="chat-screen">
      <div class="chat-layout">
        <main class="chat-main">
          
          <header class="chat-header">
            <div class="left">
              <div class="ai-avatar">
                <img src="logo.jpg" alt="NGIT AI Logo" />
              </div>
              <div class="header-texts">
                <div class="header-title" id="brandTitle">NGIT AI Mentor</div>
                <div class="header-status">
                  <span class="dot"></span>
                  <span id="statusText">Active</span>
                </div>
              </div>
            </div>
            <div class="right">
              <button id="historyToggleBtn" class="header-action" type="button" title="Chat History">
                <span class="material-symbols-outlined">history</span>
              </button>
              <button id="logoutBtn" class="header-action danger" type="button" title="Logout">
                <span class="material-symbols-outlined">logout</span>
              </button>
              <span class="header-pill">NGIT v1.0</span>
            </div>
          </header>

          <div class="chat-shell">
            <aside id="historyPanel" class="history-panel hidden">
              <div class="history-panel-head">
                <div>
                  <h3>Recent Chats</h3>
                  <p>Your saved NGIT conversations</p>
                </div>
                <button id="closeHistoryBtn" class="history-close" type="button" title="Close history">
                  <span class="material-symbols-outlined">close</span>
                </button>
              </div>
              <div id="historyList" class="history-list"></div>
            </aside>

            <div class="chat-main-panel">
              <div class="chat-body" id="chatBody">
                <div class="welcome-card" id="welcomeCard">
                  <h2 id="welcomeTitle">Welcome to NGIT AI Mentor!</h2>
                  <p id="welcomeText">Your professional automated assistant. Ask me anything about your tracks, assignments, or programming concepts.</p>
                </div>
                <div class="messages" id="messages"></div>
              </div>

              <div class="suggested-questions-container" id="suggestedQuestionsContainer">
                <div class="suggested-questions" id="suggestedQuestions"></div>
              </div>

              <footer class="chat-input-area">
                <div class="input-wrap">
                  <textarea id="chatInput" class="chat-input" placeholder="Message NGIT AI Mentor..." rows="1"></textarea>
                  <div class="actions">
                    <button class="icon-btn primary" id="sendBtn" disabled title="Send Message">
                      <span class="material-symbols-outlined">send</span>
                    </button>
                  </div>
                </div>
              </footer>
            </div>
          </div>
        </main>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
